apiVersion: v1
kind: Namespace
metadata:
  labels:
    kubernetes.io/metadata.name: cyclonus
  name: cyclonus
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cyclonus
  namespace: cyclonus
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - command:
            - ./cyclonus
            - generate
          name: cyclonus
          imagePullPolicy: IfNotPresent
          image: mfenwick100/cyclonus:latest
      serviceAccount: cyclonus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cyclonus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: cyclonus
  namespace: cyclonus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyclonus
  namespace: cyclonus

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mesh-cni.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh-cni.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mesh-cni.fullname" . }}-controller
subjects:
- kind: ServiceAccount
  name: {{ include "mesh-cni.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

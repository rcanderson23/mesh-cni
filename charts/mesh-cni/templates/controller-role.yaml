apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mesh-cni.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh-cni.controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch

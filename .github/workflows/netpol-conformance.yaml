name: Netpol Conformance Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: cyclonus-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  CLUSTER_NAME: mesh-cni
  MESH_CNI_IMAGE: mesh-cni:ci

jobs:
  cyclonus-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up kind
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: kind/single-node.yaml
          wait: 120s

      - name: Build mesh-cni image
        run: |
          set -euo pipefail
          just container

      - name: Configure kindnet and load image
        run: |
          set -euo pipefail
          kubectl -n kube-system set image ds/kindnet \
            kindnet-cni=docker.io/kindest/kindnetd:v20230809-80a64d96
          just load-image

      - name: Install mesh-cni chart
        run: |
          set -euo pipefail
          SERVER_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          helm upgrade --install mesh-cni ./charts/mesh-cni \
            -n kube-system \
            --set agent.image.repository=ghcr.io/rcanderson23/mesh-cni \
            --set agent.image.tag=latest \
            --set controller.image.repository=ghcr.io/rcanderson23/mesh-cni \
            --set controller.image.tag=latest \
            --set agent.clusterURL="${SERVER_URL}"

      - name: Run Cyclonus conformance
        run: |
          set -euo pipefail
          kubectl apply -f test/cyclonus/job.yaml
          kubectl wait --for=condition=complete --timeout=75m job/cyclonus -n cyclonus
          kubectl logs job/cyclonus -n cyclonus | tee cyclonus.log

      - name: Collect debug output on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          kubectl get pods -A -o wide > artifacts/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/events.txt || true
          kubectl describe job/cyclonus -n cyclonus > artifacts/cyclonus-job.txt || true
          kubectl logs job/cyclonus -n cyclonus > artifacts/cyclonus.log || true
          kubectl logs ds/mesh-cni-agent -n kube-system --all-containers=true > artifacts/mesh-cni-agent.log || true
          kubectl logs deploy/mesh-cni-controller -n kube-system --all-containers=true > artifacts/mesh-cni-controller.log || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonus-debug
          path: artifacts/
